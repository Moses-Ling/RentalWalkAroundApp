# Rental Walk-Around: app + Postgres. Run from this folder with a .env file next to it.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: rental
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rental -d rental"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/rentalwalkaround:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://rental:${POSTGRES_PASSWORD}@db:5432/rental
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (32+ chars)}
      UPLOAD_DIR: /data/uploads
    ports:
      # "3000:3000" listens on every network interface of the host, so the iPad can
      # reach it at http://<mac-address>:3000 whatever network the Mac joins.
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
